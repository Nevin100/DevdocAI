name: CI/CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_BACKEND: devdocai-backend
  ECR_FRONTEND: devdocai-frontend
  NEXT_PUBLIC_API_URL: https://devdocai.nevinbali.me

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
            curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value' | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::156397422443:role/DevDocAI-ECR-Push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND:${{ github.sha }} -t ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND:latest ./backend
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND:latest

      - name: Build & push frontend
        run: |
          docker build --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -t ${{ steps.ecr.outputs.registry }}/$ECR_FRONTEND:${{ github.sha }} -t ${{ steps.ecr.outputs.registry }}/$ECR_FRONTEND:latest ./frontend
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_FRONTEND:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_FRONTEND:latest

      - name: Deploy backend to ECS
        run: aws ecs update-service --cluster devdocai-cluster --service devdocai-backend-service --force-new-deployment --region $AWS_REGION

      - name: Deploy frontend to ECS
        run: aws ecs update-service --cluster devdocai-cluster --service devdocai-frontend-service --force-new-deployment --region $AWS_REGION