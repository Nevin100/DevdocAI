name: CI/CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_BACKEND: devdocai-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::163680016607:role/DevDocAI-ECR-Push
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        run: |
          docker build -t ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND:${{ github.sha }} -t ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND:latest ./backend
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_BACKEND:latest

      - name: Deploy backend to ECS
        run: aws ecs update-service --cluster devdocai-cluster --service devdocai-backend-service --force-new-deployment --region $AWS_REGION
